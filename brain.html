<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Brain — Linux Internals 3D</title>
<style>
  :root{--bg:#04060a;--panel:#0a0e13;--ink:#c9d1d9;--dim:#7b8a9c;--edge:#21262d;
        --grn:#7ee787;--amb:#ffa657;--blu:#79c0ff;--vio:#d2a8ff;--red:#ff7b72}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
  #wrap{display:grid;grid-template-columns:1fr 400px;height:100vh}

  /* ---------- graph ---------- */
  #stage{position:relative;overflow:hidden;
    background:radial-gradient(circle at 50% 45%,#0a1119 0%,#04060a 62%)}
  #svg{width:100%;height:100%;display:block;cursor:grab}
  #svg.drag{cursor:grabbing}
  .link{stroke:#1d2530;fill:none}
  .link.touches{stroke:#22303f;stroke-dasharray:3 4}
  .link.touched-by{stroke:#1a2530;stroke-dasharray:1 6;stroke-opacity:.55}
  .node circle{stroke-width:1.5;transition:opacity .16s}
  .node text{font:11px ui-monospace,monospace;fill:var(--dim);
    text-anchor:middle;pointer-events:none;user-select:none}
  .node{cursor:pointer}
  .node.sel circle{stroke:#fff;stroke-width:2.5}
  .node.sel text{fill:#fff;font-weight:700}
  .node.dim{opacity:.16}
  .node:hover circle{stroke:var(--blu)}
  .dimmed .node:not(.near){opacity:.13}
  .dimmed .node.near text{fill:#fff}
  .node.domain circle{stroke:var(--vio)}
  .node.trace circle{stroke:var(--blu)}
  .node.part circle{stroke:var(--grn)}
  .node.mnemonic circle{stroke:var(--amb)}
  .node.step circle{stroke:#4a5568}

  /* ---------- chrome ---------- */
  #hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    background:linear-gradient(#04060ae6,#04060a00);pointer-events:none}
  #hud>*{pointer-events:auto}
  h1{font-size:15px;margin:0;letter-spacing:-.2px}
  .crumb{color:var(--dim);font-size:12.5px}
  .crumb b{color:var(--grn)}
  .btn{background:#0d1117;border:1px solid var(--edge);color:var(--dim);
    border-radius:7px;padding:6px 11px;font:12px ui-monospace,monospace;cursor:pointer}
  .btn:hover{border-color:#3fb950;color:var(--grn)}
  .search{background:#0d1117;border:1px solid var(--edge);border-radius:7px;
    color:var(--ink);padding:7px 11px;font:12.5px ui-monospace,monospace;width:170px}
  .search:focus{outline:none;border-color:var(--blu)}
  #hint{position:absolute;bottom:12px;left:16px;color:#3d4757;font-size:11.5px}
  #zoomtag{position:absolute;bottom:12px;right:16px;color:#3d4757;font-size:11.5px}

  /* ---------- panel ---------- */
  #panel{border-left:1px solid var(--edge);background:var(--panel);
    overflow-y:auto;padding:18px 18px 60px}
  #panel h2{font-size:17px;margin:0 0 4px;letter-spacing:-.3px;display:flex;
    align-items:center;gap:9px}
  #panel h2 svg{width:22px;height:22px;flex:none;stroke:var(--amb);fill:none;
    stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  /* the same glyph also appears on every drill-down link: it must never be
     allowed to size itself from the SVG intrinsic size or it blows the card up */
  #panel svg{width:15px;height:15px;flex:none;stroke:var(--amb);fill:none;
    stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;
    vertical-align:-2px;margin-right:5px}
  #kind{color:var(--dim);font-size:11px;text-transform:uppercase;
    letter-spacing:.9px;margin-bottom:12px}
  #blurb{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .cap{background:#0d1117;border-left:2px solid var(--amb);border-radius:0 6px 6px 0;
    padding:9px 12px;font-size:12.5px;margin-bottom:14px;color:#d6dde6}
  .lbl{color:var(--dim);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.8px;margin:16px 0 7px}
  .chip{display:inline-block;background:#0d1117;border:1px solid var(--edge);
    border-radius:20px;padding:3px 10px;font-size:11.5px;color:var(--dim);margin:0 4px 4px 0}
  .chip b{color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:11.5px}
  th,td{padding:6px 7px;border-bottom:1px solid #161b22;text-align:left;vertical-align:top}
  th{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
  .R{color:var(--blu);font-weight:700}.W{color:var(--amb);font-weight:700}
  .RW{color:var(--vio);font-weight:700}
  .why{color:#7d8797}
  .insn{background:#0d1117;border:1px solid var(--edge);border-radius:6px;
    padding:8px 11px;font-size:13px;margin-bottom:12px;color:#a5d6ff;word-break:break-all}
  .mono{font-size:11.5px;color:var(--dim);word-break:break-all}
  .nm{color:var(--grn);font-weight:700}
  a.go{display:block;padding:8px 11px;border:1px solid var(--edge);border-radius:7px;
    margin-bottom:5px;text-decoration:none;color:var(--ink);font-size:12.5px;background:#0d1117}
  a.go:hover{border-color:var(--blu);color:var(--blu)}
  a.go span{color:var(--dim);font-size:11px}
  .empty{color:#3d4757;font-size:13px;padding-top:40px}
  #back{margin-bottom:12px}
  @media(max-width:820px){
    #wrap{grid-template-columns:1fr;grid-template-rows:1fr 46vh}
    #panel{border-left:0;border-top:1px solid var(--edge)}
    #hint,#zoomtag{display:none}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <svg id="svg"></svg>
    <div id="hud">
      <h1>◉ Second Brain</h1>
      <div class="crumb" id="crumb"></div>
      <input class="search" id="q" placeholder="find a bubble…" autocomplete="off">
      <button class="btn" id="fit">fit</button>
      <button class="btn" id="reset">reset</button>
    </div>
    <div id="hint">drag to pan · scroll to zoom · click a bubble to go deeper · double-click to open</div>
    <div id="zoomtag"></div>
  </div>
  <div id="panel"><div class="empty">Click any bubble to open it.</div></div>
</div>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('graph').textContent);
const N = DATA.nodes, E = DATA.edges;
const svg = document.getElementById('svg');
const panel = document.getElementById('panel');
const crumb = document.getElementById('crumb');
const zoomtag = document.getElementById('zoomtag');

/* ---------- adjacency ---------- */
const kids = {}, parents = {};
for (const e of E) {
  (kids[e[0]] = kids[e[0]] || []).push({ id: e[1], kind: e[2], w: e[3] });
  (parents[e[1]] = parents[e[1]] || []).push({ id: e[0], kind: e[2], w: e[3] });
}
for (const k in kids) kids[k].sort((a, b) => b.w - a.w);
const ROOT = 'd:linux';

/* radius per kind — real weight, not decoration */
function radius(n) {
  if (n.kind === 'domain') return 46;
  if (n.kind === 'trace') return 30;
  if (n.kind === 'part') return 11 + Math.min(15, Math.sqrt(n.count || 1) * 2.6);
  if (n.kind === 'mnemonic') return 9 + Math.min(11, Math.sqrt(n.count || 1) * 2.2);
  return 7;
}
const COLOR = {
  domain: '#d2a8ff', trace: '#79c0ff', part: '#7ee787',
  mnemonic: '#ffa657', step: '#8b98a9'
};
const FILL = {
  domain: 'rgba(210,168,255,.14)', trace: 'rgba(121,192,255,.13)',
  part: 'rgba(126,231,135,.12)', mnemonic: 'rgba(255,166,87,.11)',
  step: 'rgba(139,152,169,.10)'
};

/* ---------- layout ----------
 * Force-directed (Fruchterman-Reingold) with a FIXED seed, so the page is
 * byte-reproducible. A naive radial ring can't be used here: hardware parts
 * are shared between both traces, so a node has several parents and any
 * tree walk collapses them all onto the root. */
const layout = {};
{
  const ids = Object.keys(N);
  const idx = {}; ids.forEach((id, i) => idx[id] = i);
  const R = ids.length;

  // deterministic PRNG (mulberry32)
  let sd = 0x2f6e2b1;
  const rnd = () => {
    sd |= 0; sd = sd + 0x6D2B79F5 | 0;
    let t = Math.imul(sd ^ sd >>> 15, 1 | sd);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const pos = ids.map((id, i) => {
    const a = (i / R) * Math.PI * 2 + rnd() * 0.4;
    const rr = 320 + rnd() * 260;
    return { x: Math.cos(a) * rr, y: Math.sin(a) * rr, vx: 0, vy: 0 };
  });

  // edge stiffness: structural links are short and taut, co-occurrence links
  // are long and loose (they are many-to-many and would otherwise dominate).
  const stiff = { contains: 1.0, exercises: 0.9, 'occurs-at': 0.85,
                  touches: 0.30, 'touched-by': 0.12 };
  /* Tuned offline in tune-layout.py: this combination spreads all 183 nodes
     over ~930x1080 units with only 4 pairs closer than 26px (vs 149 at the
     textbook defaults), which is what "fit" needs to land near 1x zoom. */
  const AREA = 430 * 430;
  const K = Math.sqrt(AREA / R) * 1.6;   // ideal edge length
  const ATT = 0.6, REP = 0.5;

  const ed = [];
  for (const e of E) {
    const a = idx[e[0]], b = idx[e[1]];
    if (a == null || b == null) continue;
    ed.push([a, b, stiff[e[2]] != null ? stiff[e[2]] : 0.4]);
  }
  const IT = 600;
  for (let it = 0; it < IT; it++) {
    const t = 400 + (2 - 400) * it / (IT - 1);

    // repulsion, O(n^2) is fine for ~190 nodes
    for (let i = 0; i < R; i++) {
      for (let j = i + 1; j < R; j++) {
        const p = pos[i], q = pos[j];
        let dx = p.x - q.x, dy = p.y - q.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 0.01) { dx = (rnd() - 0.5) * 0.6; dy = (rnd() - 0.5) * 0.6; d2 = dx * dx + dy * dy; }
        if (d2 > 4e6) continue;                       // far pairs: ignore
        const d = Math.sqrt(d2);
        const f = (K * K) / d;                        // inverse-distance repulsion
        const ux = dx / d * f * REP, uy = dy / d * f * REP;
        p.vx += ux; p.vy += uy; q.vx -= ux; q.vy -= uy;
      }
    }
    // attraction along edges
    for (const [a, b, s] of ed) {
      const p = pos[a], q = pos[b];
      const dx = p.x - q.x, dy = p.y - q.y;
      const d = Math.max(1, Math.hypot(dx, dy));
      const f = (d * d) / K * s * ATT;
      const ux = dx / d * f, uy = dy / d * f;
      p.vx -= ux; p.vy -= uy; q.vx += ux; q.vy += uy;
    }
    // gravity toward centre so nothing drifts off, root pinned
    for (let i = 0; i < R; i++) {
      pos[i].vx -= pos[i].x * 0.002;
      pos[i].vy -= pos[i].y * 0.002;
    }
    pos[idx[ROOT]].vx = pos[idx[ROOT]].vy = 0;

    // cool + integrate
    for (let i = 0; i < R; i++) {
      if (i === idx[ROOT]) continue;
      const p = pos[i];
      const v = Math.hypot(p.vx, p.vy);
      if (v > 1e-6) {
        const s = Math.min(v, t) / v;
        p.x += p.vx * s; p.y += p.vy * s;
      }
      p.vx = p.vy = 0;
    }
  }

  ids.forEach((id, i) => { layout[id] = { x: pos[i].x, y: pos[i].y }; });

  // spread any exact overlaps left over from the simulation
  for (let pass = 0; pass < 3; pass++) {
    const cell = {};
    for (const id of ids) {
      const p = layout[id];
      const key = Math.round(p.x / 26) + ':' + Math.round(p.y / 26);
      const n = cell[key] = cell[key] || [];
      if (n.length) {
        const a = (n.length) * 1.9 + rnd() * 5;
        p.x += Math.cos(a) * (14 + rnd() * 10);
        p.y += Math.sin(a) * (14 + rnd() * 10);
      }
      n.push(id);
    }
  }
}

/* ---------- render ---------- */
const gLinks = document.createElementNS('http://www.w3.org/2000/svg', 'g');
const gNodes = document.createElementNS('http://www.w3.org/2000/svg', 'g');
svg.appendChild(gLinks); svg.appendChild(gNodes);

const linkEls = [], nodeEls = {}, groupEls = {};
for (const e of E) {
  const a = layout[e[0]], b = layout[e[1]];
  if (!a || !b) continue;
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  l.setAttribute('d', `M${a.x},${a.y} Q${mx},${my - Math.hypot(b.x - a.x, b.y - a.y) * 0.09} ${b.x},${b.y}`);
  l.setAttribute('class', 'link ' + e[2]);
  if (e[2] !== 'contains') l.setAttribute('stroke-opacity', Math.min(.85, .22 + e[3] / 26));
  gLinks.appendChild(l);
  linkEls.push({ el: l, e });
}
const RADIUS = {};
for (const id in layout) {
  const n = N[id];
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const p = layout[id];
  /* position the GROUP, not the circle: a circle has no cx/cy here, so every
     node would otherwise be drawn stacked on 0,0 */
  g.setAttribute('transform', `translate(${p.x},${p.y})`);
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  const r = radius(n);
  RADIUS[id] = r;
  c.setAttribute('r', r);
  c.setAttribute('fill', FILL[n.kind]);
  c.setAttribute('stroke', COLOR[n.kind]);
  g.appendChild(c);
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('y', r + 13);
  t.textContent = n.label;
  g.appendChild(t);
  g.setAttribute('class', 'node ' + n.kind);
  g.addEventListener('click', ev => { ev.stopPropagation(); select(id); });
  g.addEventListener('dblclick', ev => { ev.stopPropagation(); open(id); });
  gNodes.appendChild(g);
  nodeEls[id] = g; groupEls[id] = { g, c };
}

/* ---------- pan / zoom ---------- */
let k = 1, tx = 0, ty = 0;
function apply() {
  gLinks.setAttribute('transform', `translate(${tx},${ty}) scale(${k})`);
  gNodes.setAttribute('transform', `translate(${tx},${ty}) scale(${k})`);
  zoomtag.textContent = k.toFixed(2) + '×';
  draw();
}
function toSvg(ev) {
  const r = svg.getBoundingClientRect();
  return { x: (ev.clientX - r.left - tx) / k, y: (ev.clientY - r.top - ty) / k };
}
let drag = null;
svg.addEventListener('pointerdown', ev => {
  drag = { x: ev.clientX, y: ev.clientY, tx, ty, moved: 0 };
  svg.setPointerCapture(ev.pointerId); svg.classList.add('drag');
});
svg.addEventListener('pointermove', ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  tx = drag.tx + dx; ty = drag.ty + dy; apply();
});
addEventListener('pointerup', () => { drag = null; svg.classList.remove('drag'); });
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const p = toSvg(ev);
  const f = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
  k = Math.max(0.16, Math.min(5, k * f));
  tx -= (k / (k / f) - 1) * 0; // zoom about cursor
  const r = svg.getBoundingClientRect();
  const cx = ev.clientX - r.left, cy = ev.clientY - r.top;
  tx = cx - (cx - tx) * (f);
  ty = cy - (cy - ty) * (f);
  apply();
}, { passive: false });
svg.addEventListener('click', () => select(null));
function fit() {
  const r = svg.getBoundingClientRect();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const id in layout) {
    const p = layout[id], rr = RADIUS[id] + 18;
    x0 = Math.min(x0, p.x - rr); y0 = Math.min(y0, p.y - rr);
    x1 = Math.max(x1, p.x + rr); y1 = Math.max(y1, p.y + rr);
  }
  k = Math.min(r.width / (x1 - x0), r.height / (y1 - y0)) * 0.95;
  tx = r.width / 2 - k * (x0 + x1) / 2;
  ty = r.height / 2 - k * (y0 + y1) / 2;
  apply();
}
document.getElementById('fit').onclick = fit;
document.getElementById('reset').onclick = () => { select(null); fit(); };
addEventListener('resize', () => apply());

/* highlight the selected node's immediate neighbourhood */
let selected = null;
function draw() {
  if (!selected) {
    for (const id in groupEls) groupEls[id].g.classList.remove('dim', 'near');
    svg.classList.remove('dimmed');
    return;
  }
  const near = new Set([selected]);
  (parents[selected] || []).forEach(e => near.add(e.id));
  (kids[selected] || []).forEach(e => near.add(e.id));
  for (const id in groupEls) {
    groupEls[id].g.classList.toggle('near', near.has(id));
    groupEls[id].g.classList.toggle('dim', !near.has(id));
  }
  svg.classList.add('dimmed');
}

/* ---------- panel ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function chain(id) {
  const out = []; let cur = id, guard = 0;
  while (cur && guard++ < 8) {
    out.unshift(cur);
    /* prefer a contains-edge parent so the breadcrumb follows the tree */
    const ps = parents[cur] || [];
    const pick = ps.find(p => p.kind === 'contains') || ps[0];
    cur = pick ? pick.id : null;
  }
  return out;
}

function glyphSVG(n) {
  if (!n.svg) return '';
  return `<svg viewBox="0 0 24 24">${n.svg}</svg>`;
}

function rowsTable(rows) {
  if (!rows || !rows.length) return '';
  const acc = { R: 'R', W: 'W', RW: 'RW', '-': '' };
  return `<table><thead><tr><th>part</th><th>item</th><th></th><th>why</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${esc(r.part)}</td><td class="nm">${esc(r.item)}</td>` +
      `<td class="${acc[r.access] || ''}">${esc(r.access === '-' ? '' : r.access)}</td>` +
      `<td class="why">${esc(r.why)}</td></tr>`).join('') +
    `</tbody></table>`;
}

function regChips(regs) {
  const e = Object.entries(regs || {});
  if (!e.length) return '';
  return e.slice(0, 8).map(([k, v]) =>
    `<span class="chip"><b>${esc(k)}</b> ${esc('0x' + Number(v).toString(16))}</span>`).join('');
}

function flagChips(flags) {
  const e = Object.entries(flags || {});
  const on = e.filter(([, v]) => v);
  if (!on.length) return `<span class="chip">no flags set</span>`;
  return on.map(([k]) => `<span class="chip"><b>${esc(k)}</b></span>`).join('');
}

function openPanel(id) {
  if (!id) { panel.innerHTML = '<div class="empty">Click any bubble to open it.</div>'; return; }
  const n = N[id];
  const ch = chain(id);
  crumb.innerHTML = ch.map(c =>
    `<span style="cursor:pointer" data-go="${esc(c)}">${esc(N[c].label)}</span>`)
    .join(' <span style="color:#3d4757">›</span> ');

  let h = '';
  const parent = (parents[id] || []).find(p => p.kind === 'contains') || (parents[id] || [])[0];
  const back = parent ? `<button class="btn" id="back">← ${esc(N[parent.id].label)}</button>` : '';
  h += back;
  h += `<h2>${glyphSVG(n)} ${esc(n.label)}</h2>`;
  h += `<div id="kind">${esc(n.kind)}${n.tname ? ' · ' + esc(n.tname) : ''}</div>`;
  if (n.blurb) h += `<div id="blurb">${esc(n.blurb)}</div>`;
  if (n.caption) h += `<div class="cap">${esc(n.caption)}</div>`;

  if (n.kind === 'step') {
    h += `<div class="insn">${esc(n.insn)}</div>`;
    if (n.symbol) h += `<div class="mono"><span class="nm">${esc(n.symbol)}</span> · ${esc((n.file || '').split('/').pop())}:${esc(n.line)}</div>`;
    if (n.mem && n.mem.length) {
      h += `<div class="lbl">bytes at PC</div><div class="mono">${
        n.mem.map(b => b.toString(16).padStart(2, '0')).join(' ')}</div>`;
    }
    h += `<div class="lbl">registers</div><div>${regChips(n.regs)}</div>`;
    h += `<div class="lbl">EFLAGS</div><div>${flagChips(n.flags)}</div>`;
    h += `<div class="lbl">hardware touched</div>${rowsTable(n.rows)}`;
  }
  if (n.kind === 'mnemonic' && n.nmn) {
    h += `<div class="lbl">occurrences</div><div class="chip"><b>${n.nmn}</b> in this trace</div>`;
  }
  if (n.count != null && n.kind === 'part') {
    h += `<div class="lbl">touches</div><div class="chip"><b>${n.count}</b> row-events</div>`;
  }
  if (n.nsteps) {
    h += `<div class="lbl">length</div><div class="chip"><b>${n.nsteps}</b> instructions traced</div>`;
  }

  const ks = (kids[id] || []);
  if (ks.length) {
    const verb = { contains: 'contains', exercises: 'exercises', touches: 'touches', 'occurs-at': 'happens at' };
    h += `<div class="lbl">${ks.length} connected · click to go deeper</div>`;
    h += ks.map(k => {
      const c = N[k.id]; if (!c) return '';
      return `<a class="go" data-go="${esc(k.id)}">${glyphSVG(c)} ${esc(c.label)} <span>· ${esc(verb[k.kind] || k.kind)}${k.w ? ' ×' + k.w : ''}</span></a>`;
    }).join('');
  }
  panel.innerHTML = h;
  panel.scrollTop = 0;
  const b = panel.querySelector('#back');
  if (b) b.onclick = () => select(parent.id);
  panel.querySelectorAll('[data-go]').forEach(el =>
    el.onclick = () => select(el.getAttribute('data-go')));
  crumb.querySelectorAll('[data-go]').forEach(el =>
    el.onclick = () => select(el.getAttribute('data-go')));
}

function select(id) {
  selected = id;
  for (const i in nodeEls) nodeEls[i].classList.toggle('sel', i === id);
  draw();
  openPanel(id);
}
/* double-click = jump the camera to that bubble */
function open(id) {
  const p = layout[id]; if (!p) return;
  const r = svg.getBoundingClientRect();
  k = Math.max(k, 1.5);
  tx = r.width / 2 - k * p.x; ty = r.height / 2 - k * p.y;
  apply();
  select(id);
}

/* ---------- search ---------- */
document.getElementById('q').addEventListener('input', ev => {
  const q = ev.target.value.trim().toLowerCase();
  if (!q) { svg.classList.remove('dimmed'); for (const i in groupEls) groupEls[i].g.classList.remove('dim'); return; }
  const hit = id => (N[id].label + ' ' + N[id].kind).toLowerCase().includes(q);
  const any = Object.keys(N).some(hit);
  svg.classList.add('dimmed');
  for (const id in groupEls) {
    const on = hit(id);
    groupEls[id].g.classList.toggle('dim', !on);
    groupEls[id].g.classList.toggle('near', on);
  }
  if (any && !selected) openPanel(null);
});

fit();
console.log('brain: ' + Object.keys(N).length + ' nodes, ' + E.length + ' edges');
</script>
</body>
</html>
