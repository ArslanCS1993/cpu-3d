<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Brain — the kernel as files and folders</title>
<style>
  :root{--bg:#04060a;--panel:#0a0e13;--ink:#c9d1d9;--dim:#7b8a9c;--edge:#21262d;
        --grn:#7ee787;--amb:#ffa657;--blu:#79c0ff;--vio:#d2a8ff}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
  #wrap{display:grid;grid-template-columns:1fr 420px;height:100vh}

  /* ---------- canvas ---------- */
  #stage{position:relative;overflow:hidden;
    background:radial-gradient(circle at 50% 45%,#0a1119 0%,#04060a 62%)}
  #svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #svg.drag{cursor:grabbing}
  .link{stroke:#1d2530;fill:none}
  .link.flows-to{stroke:#2b3d4e;stroke-dasharray:4 5}
  .link.links{stroke:#3a2f4a;stroke-dasharray:2 6}
  .node{cursor:pointer}
  .node circle,.node rect{stroke-width:1.5}
  .node text{font:11.5px ui-monospace,monospace;fill:var(--dim);
    text-anchor:middle;pointer-events:none;user-select:none}
  .node.sel circle,.node.sel rect{stroke:#fff;stroke-width:2.6}
  .node.sel text{fill:#fff;font-weight:700}
  .node.root text{font-size:14px;fill:#e6d8ff;font-weight:700}
  .node.root circle{stroke:var(--vio);fill:rgba(210,168,255,.14)}
  .node.folder circle{stroke:var(--blu);fill:rgba(121,192,255,.11)}
  .node.file circle{stroke:var(--grn);fill:rgba(126,231,135,.10)}
  .node.ext-S circle{stroke:#ffa657;fill:rgba(255,166,87,.12)}
  .dimmed .node:not(.near){opacity:.14}
  .dimmed .link:not(.near){opacity:.10}

  /* ---------- chrome ---------- */
  #hud{position:absolute;top:0;left:0;right:0;padding:13px 16px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none}
  #hud>*{pointer-events:auto}
  h1{font-size:15px;margin:0}
  .crumb{color:var(--dim);font-size:12.5px}
  .crumb span[data-go]{cursor:pointer}
  .crumb span[data-go]:hover{color:var(--grn)}
  .btn{background:#0d1117;border:1px solid var(--edge);color:var(--dim);
    border-radius:7px;padding:6px 11px;font:12px ui-monospace,monospace;cursor:pointer}
  .btn:hover{border-color:#3fb950;color:var(--grn)}
  .search{background:#0d1117;border:1px solid var(--edge);border-radius:7px;
    color:var(--ink);padding:7px 11px;font:12.5px ui-monospace,monospace;width:180px}
  .search:focus{outline:none;border-color:var(--blu)}
  #hint{position:absolute;bottom:11px;left:16px;color:#3d4757;font-size:11.5px}
  #zoomtag{position:absolute;bottom:11px;right:16px;color:#3d4757;font-size:11.5px}
  #legend{position:absolute;top:52px;right:16px;color:#3d4757;font-size:11.5px;
    display:flex;gap:14px;flex-wrap:wrap;max-width:46%;justify-content:flex-end}
  #legend i{display:inline-block;width:9px;height:9px;border-radius:50%;
    margin-right:5px;vertical-align:-1px}
  /* search dims too, so it needs the same ancestor hook as selection */
  .searching .node:not(.near){opacity:.14}
  .searching .link{opacity:.08}

  /* ---------- panel ---------- */
  #panel{border-left:1px solid var(--edge);background:var(--panel);
    overflow-y:auto;padding:18px 18px 70px}
  #panel h2{font-size:17px;margin:0 0 3px;letter-spacing:-.3px;word-break:break-all}
  #kind{color:var(--dim);font-size:11px;text-transform:uppercase;
    letter-spacing:.9px;margin-bottom:11px}
  #blurb{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .path{background:#0d1117;border:1px solid var(--edge);border-radius:6px;
    padding:7px 10px;font-size:11.5px;color:#79c0ff;margin-bottom:13px;
    word-break:break-all}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}
  .stat{background:#0d1117;border:1px solid var(--edge);border-radius:7px;padding:9px 10px;text-align:center}
  .stat b{display:block;color:var(--grn);font-size:17px;line-height:1.25}
  .stat span{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
  .lbl{color:var(--dim);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.8px;margin:17px 0 7px}
  .chip{display:inline-block;background:#0d1117;border:1px solid var(--edge);
    border-radius:20px;padding:3px 10px;font-size:11.5px;color:var(--dim);margin:0 4px 4px 0}
  .chip b{color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:11.5px}
  th,td{padding:6px 7px;border-bottom:1px solid #161b22;text-align:left;vertical-align:top}
  th{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
  td.n{text-align:right;color:#5a6675;width:34px}
  .bar{height:4px;background:#161b22;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--grn)}
  a.go{display:block;padding:8px 11px;border:1px solid var(--edge);border-radius:7px;
    margin-bottom:5px;text-decoration:none;color:var(--ink);font-size:12.5px;
    background:#0d1117;word-break:break-word}
  a.go:hover{border-color:var(--blu);color:var(--blu)}
  a.go.dir:hover{border-color:var(--amb);color:var(--amb)}
  a.go span{color:var(--dim);font-size:11px}
  .empty{color:#3d4757;font-size:13px;padding-top:40px}
  #back{margin-bottom:12px}
  @media(max-width:860px){
    #wrap{grid-template-columns:1fr;grid-template-rows:1fr 48vh}
    #panel{border-left:0;border-top:1px solid var(--edge)}
    #hint,#zoomtag,#legend{display:none}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <svg id="svg"></svg>
    <div id="hud">
      <h1>🧠 Second Brain</h1>
      <div class="crumb" id="crumb"></div>
      <input class="search" id="q" placeholder="find a file…" autocomplete="off">
      <button class="btn" id="fit">fit</button>
      <button class="btn" id="reset">reset</button>
    </div>
    <div id="hint">drag to pan · scroll to zoom · click a bubble to open</div>
    <div id="legend">
      <span><i style="background:#d2a8ff"></i>tree root</span>
      <span><i style="background:#79c0ff"></i>folder</span>
      <span><i style="background:#7ee787"></i>.c / .h file</span>
      <span><i style="background:#ffa657"></i>.S assembly</span>
    </div>
    <div id="zoomtag"></div>
  </div>
  <div id="panel"><div class="empty">Click a folder or file to open it.</div></div>
</div>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('graph').textContent);
const N = DATA.nodes, E = DATA.edges, DET = DATA.detail || {};
const svg = document.getElementById('svg');
const panel = document.getElementById('panel');
const crumb = document.getElementById('crumb');
const zoomtag = document.getElementById('zoomtag');
const ROOT = 'd:linux-6.8.0';

const kids = {}, parents = {};
for (const e of E) {
  (kids[e[0]] = kids[e[0]] || []).push({ id: e[1], kind: e[2], w: e[3] });
  (parents[e[1]] = parents[e[1]] || []).push({ id: e[0], kind: e[2], w: e[3] });
}
const VERB = { contains: 'holds', 'flows-to': 'runs into', links: 'couples with' };
for (const k in kids) kids[k].sort((a, b) =>
  (a.kind === 'contains' ? -1 : 0) - (b.kind === 'contains' ? -1 : 0) || b.w - a.w);

function radius(n) {
  if (n.kind === 'root') return 30;
  if (n.kind === 'folder') return 13;
  return 9 + Math.min(11, Math.sqrt(n.n || 1) * 1.9);
}

/* ---------------- layout: deterministic Fruchterman-Reingold ---------------- */
const layout = {};
{
  const ids = Object.keys(N);
  const idx = {}; ids.forEach((id, i) => idx[id] = i);
  const R = ids.length;
  let sd = 0x2f6e2b1;
  const rnd = () => {
    sd |= 0; sd = sd + 0x6D2B79F5 | 0;
    let t = Math.imul(sd ^ sd >>> 15, 1 | sd);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const pos = ids.map((id, i) => {
    const a = (i / R) * Math.PI * 2 + rnd() * 0.5;
    const rr = 150 + rnd() * 150;
    return { x: Math.cos(a) * rr, y: Math.sin(a) * rr, vx: 0, vy: 0 };
  });

  /* `contains` must dominate: the tree shape is the point. `flows-to` is
     many-to-many and would otherwise drag the hierarchy into a hairball. */
  const stiff = { contains: 1.0, links: 0.25, 'flows-to': 0.16 };
  const AREA = 300 * 300;
  const K = Math.sqrt(AREA / R) * 1.5;
  const ATT = 0.7, REP = 0.55;

  const ed = [];
  for (const e of E) {
    const a = idx[e[0]], b = idx[e[1]];
    if (a == null || b == null) continue;
    ed.push([a, b, stiff[e[2]] != null ? stiff[e[2]] : 0.3]);
  }
  const IT = 600;
  for (let it = 0; it < IT; it++) {
    const t = 340 + (2 - 340) * it / (IT - 1);
    for (let i = 0; i < R; i++) {
      for (let j = i + 1; j < R; j++) {
        const p = pos[i], q = pos[j];
        let dx = p.x - q.x, dy = p.y - q.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 0.01) { dx = (rnd() - .5) * .6; dy = (rnd() - .5) * .6; d2 = Math.max(.01, dx * dx + dy * dy); }
        const d = Math.sqrt(d2);
        const m = K * K / d * REP;
        const ux = dx / d * m, uy = dy / d * m;
        p.vx += ux; p.vy += uy; q.vx -= ux; q.vy -= uy;
      }
    }
    for (const [a, b, s] of ed) {
      const p = pos[a], q = pos[b];
      const dx = p.x - q.x, dy = p.y - q.y;
      const d = Math.max(1, Math.hypot(dx, dy));
      const m = d * d / K * s * ATT;
      const ux = dx / d * m, uy = dy / d * m;
      p.vx -= ux; p.vy -= uy; q.vx += ux; q.vy += uy;
    }
    for (let i = 0; i < R; i++) {
      pos[i].vx -= pos[i].x * 0.004;
      pos[i].vy -= pos[i].y * 0.004;
    }
    pos[idx[ROOT]].vx = pos[idx[ROOT]].vy = 0;
    for (let i = 0; i < R; i++) {
      if (i === idx[ROOT]) continue;
      const p = pos[i];
      const v = Math.hypot(p.vx, p.vy);
      if (v > 1e-9) { const s = Math.min(v, t) / v; p.x += p.vx * s; p.y += p.vy * s; }
      p.vx = p.vy = 0;
    }
  }
  ids.forEach((id, i) => { layout[id] = { x: pos[i].x, y: pos[i].y }; });

  /* push children below their parent so folders read top-down as a tree */
  for (let pass = 0; pass < 6; pass++) {
    for (const [a, b, k] of ed) {
      if (k !== 'contains') continue;
      const pa = layout[a], pb = layout[b];
      if (!pa || !pb) continue;
      pb.x += (pa.x - pb.x) * 0.10;
      pb.y += (pb.y - pa.y) * 0.10 + 8;
    }
  }
  /* resolve any collisions left over */
  for (let pass = 0; pass < 4; pass++) {
    const cell = {};
    for (const id in layout) {
      const p = layout[id];
      const key = Math.round(p.x / 30) + ':' + Math.round(p.y / 30);
      const arr = cell[key] = cell[key] || [];
      if (arr.length) {
        const a = arr.length * 2.1 + rnd() * 6;
        p.x += Math.cos(a) * (16 + rnd() * 12);
        p.y += Math.sin(a) * (16 + rnd() * 12);
      }
      arr.push(id);
    }
  }
}

/* ---------------- render ---------------- */
const SVGNS = 'http://www.w3.org/2000/svg';
const gLinks = document.createElementNS(SVGNS, 'g');
const gNodes = document.createElementNS(SVGNS, 'g');
svg.appendChild(gLinks); svg.appendChild(gNodes);

const RADIUS = {}, linkEls = [], groupEls = {};
for (const e of E) {
  const a = layout[e[0]], b = layout[e[1]];
  if (!a || !b) continue;
  const l = document.createElementNS(SVGNS, 'path');
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const bow = Math.hypot(b.x - a.x, b.y - a.y) * 0.10;
  l.setAttribute('d', `M${a.x},${a.y} Q${mx},${my - bow} ${b.x},${b.y}`);
  l.setAttribute('class', 'link ' + e[2]);
  if (e[2] === 'flows-to') l.setAttribute('stroke-opacity', Math.min(.9, .3 + e[3] / 6));
  gLinks.appendChild(l);
  linkEls.push({ el: l, e });
}

for (const id in layout) {
  const n = N[id];
  const g = document.createElementNS(SVGNS, 'g');
  const p = layout[id];
  g.setAttribute('transform', `translate(${p.x},${p.y})`);
  g.setAttribute('class', 'node ' + n.kind + (n.ext ? ' ext-' + n.ext : ''));
  const r = radius(n);
  RADIUS[id] = r;
  const c = document.createElementNS(SVGNS, 'circle');
  c.setAttribute('r', r);
  g.appendChild(c);
  const t = document.createElementNS(SVGNS, 'text');
  t.setAttribute('y', r + 14);
  t.textContent = n.label;
  g.appendChild(t);
  if (n.kind === 'folder' && n.n) {
    const cnt = document.createElementNS(SVGNS, 'text');
    cnt.setAttribute('y', -r - 7);
    cnt.setAttribute('fill', '#4a5a6c');
    cnt.setAttribute('font-size', '10');
    cnt.textContent = n.n;
    g.appendChild(cnt);
  }
  g.addEventListener('click', ev => { ev.stopPropagation(); select(id); });
  gNodes.appendChild(g);
  groupEls[id] = g;
}

/* ---------------- pan / zoom ---------------- */
let k = 1, tx = 0, ty = 0;
function apply() {
  const t = `translate(${tx},${ty}) scale(${k})`;
  gLinks.setAttribute('transform', t);
  gNodes.setAttribute('transform', t);
  zoomtag.textContent = k.toFixed(2) + '×';
}
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const cx = ev.clientX - r.left, cy = ev.clientY - r.top;
  const f = ev.deltaY < 0 ? 1.13 : 1 / 1.13;
  k = Math.max(0.2, Math.min(4, k * f));
  tx = cx - (cx - tx) * f;
  ty = cy - (cy - ty) * f;
  apply();
}, { passive: false });
let drag = null;
svg.addEventListener('pointerdown', ev => {
  drag = { x: ev.clientX, y: ev.clientY, tx, ty };
  svg.setPointerCapture(ev.pointerId); svg.classList.add('drag');
});
svg.addEventListener('pointermove', ev => {
  if (!drag) return;
  tx = drag.tx + ev.clientX - drag.x;
  ty = drag.ty + ev.clientY - drag.y;
  apply();
});
addEventListener('pointerup', () => { drag = null; svg.classList.remove('drag'); });
svg.addEventListener('click', () => select(null));
function fit() {
  const r = svg.getBoundingClientRect();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const id in layout) {
    const p = layout[id];
    /* labels are far wider than the circles (e.g. "atomic-arch-fallback.h"),
       so the box must be padded by the real text half-width or the fit
       crops the long names */
    const hw = Math.max(RADIUS[id], (N[id].label.length * 6.6) / 2) + 14;
    x0 = Math.min(x0, p.x - hw); y0 = Math.min(y0, p.y - RADIUS[id] - 8);
    x1 = Math.max(x1, p.x + hw); y1 = Math.max(y1, p.y + RADIUS[id] + 22);
  }
  k = Math.min(r.width / (x1 - x0), r.height / (y1 - y0)) * 0.97;
  /* anchor the tree a little above centre: labels hang below their bubble and
     the toolbar owns the top strip, so optical centring is not geometric */
  tx = r.width / 2 - k * (x0 + x1) / 2;
  ty = (r.height + 26) / 2 - k * (y0 + y1) / 2;
  apply();
}
document.getElementById('fit').onclick = fit;
document.getElementById('reset').onclick = () => { select(null); fit(); };
addEventListener('resize', apply);

/* ---------------- highlight ---------------- */
let selected = null, searching = false;
function draw() {
  const near = new Set();
  if (selected) {
    near.add(selected);
    (parents[selected] || []).forEach(e => near.add(e.id));
    (kids[selected] || []).forEach(e => near.add(e.id));
    svg.classList.add('dimmed');
  } else svg.classList.remove('dimmed');
  /* an active search owns the highlight: redrawing for a selection change
     must not wipe out what the user just typed */
  if (searching) return;
  for (const id in groupEls) groupEls[id].classList.toggle('near', near.has(id));
  for (const L of linkEls) {
    const on = selected && (L.e[0] === selected || L.e[1] === selected);
    L.el.classList.toggle('near', !!on);
    if (selected && !on) L.el.setAttribute('stroke-opacity', '0.06');
    else L.el.removeAttribute('stroke-opacity');
  }
}

/* ---------------- panel ---------------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function chain(id) {
  const out = []; let cur = id, g = 0;
  while (cur && g++ < 12) {
    out.unshift(cur);
    const ps = parents[cur] || [];
    const pick = ps.find(p => p.kind === 'contains') || ps[0];
    cur = pick ? pick.id : null;
  }
  return out;
}

function topList(obj, limit, label) {
  const e = Object.entries(obj).sort((a, b) => b[1] - a[1]);
  const max = e.length ? e[0][1] : 1;
  return `<table><thead><tr><th>${label}</th><th style="width:96px"></th><th style="width:38px;text-align:right">n</th></tr></thead><tbody>` +
    e.slice(0, limit).map(([k, v]) =>
      `<tr><td>${esc(k)}</td><td><div class="bar"><i style="width:${Math.round(100 * v / max)}%"></i></div></td>` +
      `<td class="n">${v}</td></tr>`).join('') + `</tbody></table>`;
}

function openPanel(id) {
  if (!id) { panel.innerHTML = '<div class="empty">Click a folder or file to open it.</div>'; crumb.innerHTML = ''; return; }
  const n = N[id];
  crumb.innerHTML = chain(id).map(c =>
    `<span data-go="${esc(c)}">${c === id ? `<b style="color:#7ee787">${esc(N[c].label)}</b>` : esc(N[c].label)}</span>`)
    .join(' <span style="color:#3d4757">/</span> ');

  const parent = (parents[id] || []).find(p => p.kind === 'contains') || (parents[id] || [])[0];
  let h = parent ? `<button class="btn" id="back">↑ ${esc(N[parent.id].label)}</button>` : '';
  h += `<h2>${n.kind === 'root' ? '🧠' : n.kind === 'folder' ? '📁' : n.ext === 'S' ? '⚙️' : '📄'} ${esc(n.label)}</h2>`;
  h += `<div id="kind">${esc(n.kind)}${n.ext ? ' · .' + esc(n.ext) : ''}</div>`;
  if (n.path) h += `<div class="path">${esc(n.path)}</div>`;
  if (n.blurb) h += `<div id="blurb">${esc(n.blurb)}</div>`;

  /* aggregate a folder's stats from the files inside it */
  let d = DET[n.path];
  if (!d && n.kind === 'folder') {
    const sub = (kids[id] || []).map(c => DET[N[c.id] && N[c.id].path]).filter(Boolean);
    if (sub.length) {
      const agg = { n: 0, lines: new Set(), syms: new Set(), mnem: {}, parts: {}, traces: new Set(), files: 0 };
      for (const s of sub) {
        agg.n += s.n; agg.files++;
        Object.keys(s.lines).forEach(x => agg.lines.add(x));
        Object.keys(s.syms).forEach(x => agg.syms.add(x));
        s.traces.forEach(x => agg.traces.add(x));
        for (const k in s.mnem) agg.mnem[k] = (agg.mnem[k] || 0) + s.mnem[k];
        for (const k in s.parts) agg.parts[k] = (agg.parts[k] || 0) + s.parts[k];
      }
      d = { n: agg.n, lines: agg.lines.size, syms: agg.syms.size, mnem: agg.mnem,
            parts: agg.parts, traces: [...agg.traces], files: agg.files };
    }
  }

  const nLines = v => typeof v === 'number' ? v : Object.keys(v || {}).length;
  const nSyms = v => typeof v === 'number' ? v : Object.keys(v || {}).length;
  if (d) {
    const nl = nLines(d.lines), ns = nSyms(d.syms);
    h += `<div class="stats">
      <div class="stat"><b>${d.n}</b><span>instructions</span></div>
      <div class="stat"><b>${nl}</b><span>lines</span></div>
      <div class="stat"><b>${n.kind === 'folder' ? d.files : ns}</b><span>${n.kind === 'folder' ? 'files' : 'symbols'}</span></div>
    </div>`;
    h += `<div class="lbl">seen in</div><div>` +
      d.traces.map(t => `<span class="chip"><b>${esc(t)}</b> trace</span>`).join('') + `</div>`;
    if (Object.keys(d.parts).length) {
      h += `<div class="lbl">hardware it exercises</div>` + topList(d.parts, 6, 'block');
    }
    if (Object.keys(d.mnem).length) {
      h += `<div class="lbl">instructions used here</div>` + topList(d.mnem, 8, 'mnemonic');
    }
    if (n.kind === 'file' && Object.keys(d.lines).length) {
      const ls = Object.entries(d.lines).sort((a, b) => a[0] - b[0]);
      h += `<div class="lbl">source lines hit</div>` +
        `<table><thead><tr><th>line</th><th style="text-align:right">instructions</th></tr></thead><tbody>` +
        ls.slice(0, 14).map(([l, c]) => `<tr><td style="color:#79c0ff">${esc(l)}</td><td class="n">${c}</td></tr>`).join('') +
        `</tbody></table>`;
    }
  }

  const ks = kids[id] || [];
  if (ks.length) {
    const dirs = ks.filter(k => N[k.id].kind === 'folder');
    const files = ks.filter(k => N[k.id].kind === 'file');
    const flows = ks.filter(k => k.kind !== 'contains');
    const card = k => {
      const c = N[k.id];
      return `<a class="go ${c.kind === 'folder' ? 'dir' : ''}" data-go="${esc(k.id)}">` +
        `${c.kind === 'folder' ? '📁' : '📄'} ${esc(c.label)} ` +
        `<span>· ${esc(VERB[k.kind] || k.kind)}${k.w ? ' ×' + k.w : ''}` +
        `${c.n ? ' · ' + c.n + ' insn' : ''}</span></a>`;
    };
    if (dirs.length) h += `<div class="lbl">${dirs.length} subfolder${dirs.length > 1 ? 's' : ''}</div>` + dirs.map(card).join('');
    if (files.length) h += `<div class="lbl">${files.length} file${files.length > 1 ? 's' : ''}</div>` + files.map(card).join('');
    if (flows.length) {
      h += `<div class="lbl">execution hand-offs — the CPU really went from here to</div>`;
      h += flows.sort((a, b) => b.w - a.w).slice(0, 12).map(card).join('');
    }
  }
  panel.innerHTML = h;
  panel.scrollTop = 0;
  const b = panel.querySelector('#back');
  if (b) b.onclick = () => select(parent.id);
  panel.querySelectorAll('[data-go]').forEach(el =>
    el.onclick = () => select(el.getAttribute('data-go')));
  crumb.querySelectorAll('[data-go]').forEach(el =>
    el.onclick = () => select(el.getAttribute('data-go')));
}

function select(id) {
  selected = id;
  for (const i in groupEls) groupEls[i].classList.toggle('sel', i === id);
  draw();
  openPanel(id);
}

/* ---------------- search ---------------- */
document.getElementById('q').addEventListener('input', ev => {
  const q = ev.target.value.trim().toLowerCase();
  searching = !!q;
  svg.classList.toggle('searching', !!q);
  for (const id in groupEls) {
    groupEls[id].classList.remove('dim', 'near');
    if (!q) continue;
    const n = N[id];
    const hit = (n.label + ' ' + (n.path || '') + ' ' + n.kind).toLowerCase().includes(q);
    groupEls[id].classList.toggle('dim', !hit);
    groupEls[id].classList.toggle('near', hit);
  }
  if (q) { selected = null; for (const i in groupEls) groupEls[i].classList.remove('sel'); }
  draw();
});

fit();
console.log('brain(files): ' + Object.keys(N).length + ' nodes, ' + E.length + ' edges');
</script>
